<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مفتاح القصر المفقود</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Tahoma", Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #17152b;
            color: white;
        }

        /* الخلفية */
        .game {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(120, 91, 180, 0.35), transparent 30%),
                radial-gradient(circle at 80% 30%, rgba(80, 110, 180, 0.25), transparent 30%),
                linear-gradient(160deg, #16132b, #29204b 55%, #101020);
        }

        /* النجوم */
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 2s infinite alternate;
        }

        .star:nth-child(1) { top: 10%; left: 10%; }
        .star:nth-child(2) { top: 20%; left: 25%; animation-delay: .5s; }
        .star:nth-child(3) { top: 12%; left: 75%; animation-delay: 1s; }
        .star:nth-child(4) { top: 35%; left: 88%; animation-delay: .3s; }
        .star:nth-child(5) { top: 60%; left: 8%; animation-delay: .8s; }
        .star:nth-child(6) { top: 70%; left: 80%; animation-delay: 1.2s; }
        .star:nth-child(7) { top: 82%; left: 30%; animation-delay: .4s; }
        .star:nth-child(8) { top: 45%; left: 45%; animation-delay: 1.5s; }
        .star:nth-child(9) { top: 15%; left: 50%; animation-delay: .7s; }
        .star:nth-child(10) { top: 90%; left: 65%; animation-delay: 1.1s; }

        @keyframes twinkle {
            from { opacity: .2; transform: scale(.7); }
            to { opacity: 1; transform: scale(1.3); }
        }

        /* الصفحة */
        .screen {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .screen.active {
            display: flex;
        }

        /* بطاقة البداية */
        .intro-card {
            width: min(700px, 95%);
            text-align: center;
            padding: 45px 30px;
            border-radius: 30px;
            background: rgba(25, 21, 50, 0.88);
            border: 1px solid rgba(255,255,255,.15);
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            backdrop-filter: blur(12px);
        }

        .crown {
            font-size: 75px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: clamp(30px, 7vw, 55px);
            margin-bottom: 15px;
        }

        .gold {
            color: #ffd76a;
        }

        .story {
            line-height: 2;
            color: #ddd8ec;
            font-size: 17px;
            margin: 20px auto;
            max-width: 580px;
        }

        .start-btn,
        .next-btn,
        .restart-btn {
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            background: linear-gradient(135deg, #f5c75d, #d99532);
            color: #24182b;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
            box-shadow: 0 8px 20px rgba(0,0,0,.25)};
