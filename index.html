<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة جمع التفاح</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#8ed8ff,#e8f8ff);
    text-align:center;
}

h1{color:#7b3f00}

#game{
    width:90%;
    max-width:600px;
    height:500px;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:linear-gradient(#bdeaff 70%,#72c45a 70%);
    border:4px solid #654321;
    border-radius:20px;
}

#girl{
    position:absolute;
    bottom:15px;
    left:45%;
    font-size:60px;
}

#apple{
    position:absolute;
    top:0;
    left:50%;
    font-size:35px;
}

#score{
    font-size:22px;
    font-weight:bold;
    margin:10px;
}

button{
    padding:12px 25px;
    margin:10px;
    border:0;
    border-radius:15px;
    background:#ffcc55;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🍎 لعبة جمع التفاح 🍎</h1>

<div id="score">النقاط: 0 / 5</div>

<div id="game">
    <div id="apple">🍎</div>
    <div id="girl">👧🧺</div>
</div>

<button onclick="moveLeft()">⬅️ يسار</button>
<button onclick="moveRight()">يمين ➡️</button>

<h2 id="message"></h2>

<script>

let score = 0;
let appleTop = 0;
let appleLeft = Math.random() * 90;
let girlLeft = 45;

const apple = document.getElementById("apple");
const girl = document.getElementById("girl");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

function newApple(){

    appleTop = 0;
    appleLeft = Math.random() * 90;

    apple.style.top = appleTop + "%";
    apple.style.left = appleLeft + "%";
}

function moveLeft(){

    girlLeft -= 7;

    if(girlLeft < 0)
        girlLeft = 0;

    girl.style.left = girlLeft + "%";
}

function moveRight(){

    girlLeft += 7;

    if(girlLeft > 85)
        girlLeft = 85;

    girl.style.left = girlLeft + "%";
}

document.addEventListener("keydown",function(e){

    if(e.key === "ArrowLeft")
        moveLeft();

    if(e.key === "ArrowRight")
        moveRight();

});

function fall(){

    appleTop += 1;

    apple.style.top = appleTop + "%";

    let appleX = appleLeft;
    let girlX = girlLeft;

    if(
        appleTop > 82 &&
        Math.abs(appleX - girlX) < 12
    ){

        score++;

        scoreText.innerText =
            "النقاط: " + score + " / 5";

        if(score === 5){

            message.innerText =
                "🎉 أحسنتِ! جمعتِ كل التفاح! 🍎🏆";

            apple.style.display = "none";

            return;
        }

        newApple();
    }

    if(appleTop > 100){

        newApple();
    }
}

setInterval(fall,40);

newApple();

</script>

</body>
</html>
